# Opt-in PostgreSQL/Supabase variant. The profile group in application.yaml also
# activates cloud, preserving Clerk, role checks and the cloud DataSource wiring.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: ${DB_POOL_MIN:0}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns DDL; Hibernate verifies the opt-in schema at startup.
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          auto: validate
        default_schema: associago
        boot:
          allow_jdbc_metadata_access: true
      jakarta:
        persistence:
          schema-generation:
            database:
              action: validate
  flyway:
    enabled: true
    locations: classpath:db/migration_postgresql
    default-schema: associago
    schemas: associago
    create-schemas: true
    # Never silently adopt an unrelated populated Supabase database.
    baseline-on-migrate: false
    clean-disabled: true
